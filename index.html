<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111224"><title>Buenos Aires • Noche Zombie</title><link rel="stylesheet" href="style.css"></head><body>
<main id="menu"><div class="eyebrow">UNA AVENTURA DE HALLOWEEN</div><h1>BUENOS AIRES<span>NOCHE ZOMBIE</span></h1><p class="intro">La ciudad se llenó de zombis. Elegí tu héroe y recuperá la noche.</p><div class="characters"><button class="character selected" data-hero="0" aria-pressed="true"><img src="assets/esqueleto.jpg" alt="Personaje con disfraz de esqueleto"><div><small>01 / EL GUARDIÁN</small><h2>Esqueleto</h2><p>Rayos de hueso · más resistencia</p></div><b>✓</b></button><button class="character" data-hero="1" aria-pressed="false"><img src="assets/brujita.jpg" alt="Personaje con vestido negro y escoba"><div><small>02 / LA HECHICERA</small><h2>Brujita</h2><p>Magia violeta · más velocidad</p></div><b>✓</b></button></div><label class="place-label" for="place">ELEGÍ DÓNDE EMPEZAR</label><select id="place"><option value="0">☾ Cementerio de la Recoleta</option><option value="1">△ El Obelisco</option><option value="2">⚓ Caminito, La Boca</option></select><button id="play" class="primary">¡SALVAR BUENOS AIRES! <span>→</span></button><p class="instructions">WASD o flechas para moverte · Espacio para disparar<br>En celular: joystick y botón de magia. Apuntado automático.</p><footer>3 ESCENARIOS · 6 OLEADAS · UNA CIUDAD POR SALVAR</footer></main>
<section id="game" hidden><canvas id="world" aria-label="Juego de supervivencia contra zombis"></canvas><header class="hud"><div><small id="location"></small><strong id="wave"></strong></div><div class="stats"><span id="health"></span><span id="score"></span><button id="pause" aria-label="Pausar">Ⅱ</button></div></header><div id="notice"></div><div class="touch"><div id="stick"><div id="knob"></div></div><button id="fire" aria-label="Disparar magia">✦<small>MAGIA</small></button></div><div id="overlay" hidden><div class="dialog"><span id="endIcon">☾</span><h2 id="endTitle"></h2><p id="endText"></p><button id="resume" class="primary">Continuar</button><button id="back" class="secondary">Elegir personaje</button></div></div></section><script src="game.js"></script></body></html>
