<section id="game" hidden><canvas id="world" aria-label="Juego de supervivencia contra zombis"></canvas><header class="hud"><div><small id="location"></small><strong id="wave"></strong></div><div class="stats"><span id="health"></span><span id="score"></span><button id="pause" aria-label="Pausar">Ⅱ</button></div></header><div id="notice"></div><div class="touch"><div id="stick"><div id="knob"></div></div><button id="fire" aria-label="Disparar magia">✦<small>MAGIA</small></button></div><div id="overlay" hidden><div class="dialog"><span id="endIcon">☾</span><h2 id="endTitle"></h2><p id="endText"></p><button id="resume" class="primary">Continuar</button><button id="back" class="secondary">Elegir personaje</button></div></div></section><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d');
const places=['Cementerio de la Recoleta','El Obelisco · Av. 9 de Julio','Caminito · La Boca'];
let hero=0,running=false,paused=false,ended=false,player,zombies=[],shots=[],sparks=[],pickups=[],kills=0,wave=1,spawned=0,waveKills=0,spawnClock=0,shotClock=0,last=0,noticeTime=0,scene=0,startScene=0,t=0;
const keys=new Set(),joy={x:0,y:0},world={w:1100,h:760};let firing=false;
document.querySelectorAll('.character').forEach(b=>b.onclick=()=>{hero=+b.dataset.hero;document.querySelectorAll('.character').forEach(c=>{c.classList.toggle('selected',c===b);c.setAttribute('aria-pressed',String(c===b));});});
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;}addEventListener('resize',resize);resize();
function announce(s){$('notice').textContent=s;noticeTime=3;}
function start(){startScene=+$('place').value;scene=startScene;player={x:550,y:440,hp:hero?5:7,max:hero?5:7,inv:0};zombies=[];shots=[];sparks=[];pickups=[];kills=0;wave=1;spawned=0;waveKills=0;spawnClock=0;shotClock=0;t=0;running=true;paused=false;ended=false;keys.clear();joy.x=joy.y=0;$('menu').hidden=true;$('game').hidden=false;$('overlay').hidden=true;announce('Oleada 1 · ¡Que empiece la magia!');hud();}
$('play').onclick=start;
function hud(){$('location').textContent=places[scene];$('wave').textContent=`OLEADA ${wave} / 6`;$('health').textContent=`♥ ${player.hp} / ${player.max}`;$('score').textContent=`✦ ${kills*100}`;}
function overlay(title,text,done=false){paused=true;ended=done;$('endTitle').textContent=title;$('endText').textContent=text;$('resume').textContent=done?'Volver a jugar':'Continuar';$('overlay').hidden=false;keys.clear();firing=false;joy.x=joy.y=0;$('knob').style.transform='';}
function pause(){if(!running||ended)return;if(paused){paused=false;$('overlay').hidden=true;}else overlay('Una pausa en la noche','Tomá aire. Buenos Aires te espera.');}
$('pause').onclick=pause;$('resume').onclick=()=>ended?start():pause();$('back').onclick=()=>{running=false;paused=false;$('game').hidden=true;$('menu').hidden=false;};
addEventListener('keydown',e=>{if(!running)return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat)pause();});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{if(running&&!paused)pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause();});
let stickPointer=null;const stick=$('stick');function moveStick(e){const r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),m=Math.min(d,40);joy.x=d?x/d*m/40:0;joy.y=d?y/d*m/40:0;$('knob').style.transform=`translate(${joy.x*36}px,${joy.y*36}px)`;}
stick.onpointerdown=e=>{stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e);};stick.onpointermove=e=>{if(e.pointerId===stickPointer)moveStick(e);};function releaseStick(){stickPointer=null;joy.x=joy.y=0;$('knob').style.transform='';}stick.onpointerup=releaseStick;stick.onpointercancel=releaseStick;
$('fire').onpointerdown=e=>{e.preventDefault();$('fire').setPointerCapture(e.pointerId);firing=true;};$('fire').onpointerup=$('fire').onpointercancel=()=>firing=false;
function spawn(){let x,y;const side=Math.floor(Math.random()*4);if(side<2){x=side?1080:20;y=80+Math.random()*650;}else{x=20+Math.random()*1060;y=side===2?60:740;}zombies.push({x,y,hp:wave>3?2:1,speed:32+wave*5+Math.random()*15,phase:Math.random()*6});spawned++;}
function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*100;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,color});}}
function update(dt){t+=dt;noticeTime-=dt;if(noticeTime<=0)$('notice').textContent='';player.inv-=dt;let dx=joy.x+(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0),dy=joy.y+(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-(keys.has('KeyW')||keys.has('ArrowUp')?1:0),len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len;}player.x=Math.max(25,Math.min(1075,player.x+dx*(hero?235:200)*dt));player.y=Math.max(95,Math.min(730,player.y+dy*(hero?235:200)*dt));
const quota=8+wave*3;spawnClock-=dt;if(spawnClock<=0&&spawned<quota){spawn();spawnClock=Math.max(.4,1.2-wave*.1);}shotClock-=dt;if((keys.has('Space')||firing)&&shotClock<=0){let target=zombies.reduce((best,z)=>!best||Math.hypot(z.x-player.x,z.y-player.y)<Math.hypot(best.x-player.x,best.y-player.y)?z:best,null);const a=target?Math.atan2(target.y-player.y,target.x-player.x):-Math.PI/2;shots.push({x:player.x,y:player.y-12,vx:Math.cos(a)*530,vy:Math.sin(a)*530,life:2});shotClock=hero?.22:.28;}
for(const b of shots){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const z of zombies){if(z.hp>0&&b.life>0&&Math.hypot(z.x-b.x,z.y-b.y)<25){b.life=0;z.hp--;burst(z.x,z.y,hero?'#d69eff':'#c4ec78');if(z.hp<=0){kills++;waveKills++;if(Math.random()<.12)pickups.push({x:z.x,y:z.y,life:15});}}}}
zombies=zombies.filter(z=>z.hp>0);shots=shots.filter(b=>b.life>0);for(const z of zombies){const a=Math.atan2(player.y-z.y,player.x-z.x);z.x+=Math.cos(a)*z.speed*dt;z.y+=Math.sin(a)*z.speed*dt;if(Math.hypot(z.x-player.x,z.y-player.y)<30&&player.inv<=0){player.hp--;player.inv=1.5;z.x-=Math.cos(a)*55;z.y-=Math.sin(a)*55;burst(player.x,player.y,'#ff8d9d');if(player.hp<=0){hud();overlay('¡La noche pide revancha!',`Eliminaste ${kills} zombis y llegaste a la oleada ${wave}. Probá moverte mientras disparás.`,true);return;}}}
for(const p of pickups){p.life-=dt;if(Math.hypot(p.x-player.x,p.y-player.y)<30){player.hp=Math.min(player.max,player.hp+1);p.life=0;burst(p.x,p.y,'#ff8d9d');}}pickups=pickups.filter(p=>p.life>0);for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}sparks=sparks.filter(p=>p.life>0);
if(waveKills>=quota){if(wave===6){hud();overlay('¡Buenos Aires está a salvo!',`Completaste las 6 oleadas. ${kills} zombis derrotados · ${kills*100} puntos. ¡Una noche legendaria!`,true);return;}wave++;spawned=0;waveKills=0;spawnClock=2;player.hp=Math.min(player.max,player.hp+2);if(wave===3||wave===5){scene=(scene+1)%3;player.x=550;player.y=440;shots=[];pickups=[];}announce(`Oleada ${wave} · ${places[scene]}`);}hud();}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}function circle(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}function line(x,y,a,b,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.stroke();}
function background(){rect(0,0,1100,760,scene===0?'#1b292b':scene===1?'#232936':'#26303a');circle(945,95,43,'#c9d4a5');circle(926,83,43,scene===0?'#1b292b':scene===1?'#232936':'#26303a');for(let i=0;i<45;i++)circle((i*173)%1100,(i*79)%270,1,'#7c8a8f');if(scene===0){for(let i=0;i<17;i++){const x=i*73;rect(x,160,5,100,'#101a20');line(x-8,175,x+12,175,'#101a20',4);}rect(0,247,1100,7,'#111a20');for(let i=0;i<20;i++){let x=60+(i*163)%1000,y=300+Math.floor(i/5)*104;ctx.fillStyle='#3c4a4c';ctx.beginPath();ctx.roundRect(x,y,32,44,[15,15,2,2]);ctx.fill();line(x+16,y+12,x+16,y+29,'#263339');line(x+9,y+19,x+23,y+19,'#263339');rect(x-5,y+43,42,6,'#111e24');}for(const x of [16,1055]){rect(x,100,18,590,'#111f25');for(let j=0;j<4;j++)line(x+8,200+j*75,x+(j%2?80:-60),140+j*55,'#111f25',9);}}else if(scene===1){rect(370,250,360,510,'#323947');for(let y=290;y<760;y+=90)rect(545,y,10,38,'#a8ad9760');for(let i=0;i<8;i++){rect(i*150,150,100,170,'#141d2b');for(let j=0;j<4;j++)rect(i*150+20,j*32+175,12,15,'#d1b57650');}ctx.fillStyle='#d6d4bc';ctx.beginPath();ctx.moveTo(550,66);ctx.lineTo(567,115);ctx.lineTo(576,310);ctx.lineTo(524,310);ctx.lineTo(533,115);ctx.closePath();ctx.fill();rect(526,310,48,12,'#b4b49f');rect(544,264,12,32,'#545b59');for(let i=0;i<4;i++)rect(390+i*88,352,54,22,'#babba965');}else{const colors=['#a14f3c','#bf953e','#387987','#697d48','#9b5771'];for(let i=0;i<5;i++){rect(i*230,145,220,180,colors[i]);rect(i*230+20,132,180,12,'#16202a');for(let j=0;j<3;j++){rect(i*230+22+j*65,176,40,55,'#162636');rect(i*230+22+j*65,240,40,60,'#23313c');}}for(let y=350;y<760;y+=44)for(let x=0;x<1100;x+=88)rect(x+(y%88?0:44),y,84,2,'#65707530');}for(let i=0;i<9;i++){ctx.fillStyle='#a0bcc005';ctx.beginPath();ctx.ellipse((i*217+t*10)%1300-100,400+i*38,200,25,0,0,7);ctx.fill();}}
function person(x,y,type,phase=0){ctx.save();ctx.translate(x,y);ctx.scale(1,1);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(0,20,20,7,0,0,7);ctx.fill();const bob=Math.sin(t*8+phase)*2;ctx.translate(0,bob);if(type==='zombie'){line(-7,8,-10,21,'#263747',7);line(7,8,11,21,'#263747',7);rect(-12,-9,24,24,'#657b50');line(-12,-5,-25,-1,'#85aa69',7);line(12,-5,25,-1,'#85aa69',7);circle(0,-21,14,'#8da975');rect(-8,-25,5,4,'#ecdfac');rect(4,-25,5,4,'#ecdfac');line(-5,-15,6,-14,'#334b3d',3);}else if(type==='skeleton'){line(-6,6,-9,22,'#111622',8);line(6,6,10,22,'#111622',8);rect(-12,-12,24,28,'#101522');circle(0,-25,15,'#e2dfcc');circle(-6,-28,4,'#222538');circle(6,-28,4,'#222538');rect(-5,-18,10,3,'#42434c');line(0,-10,0,11,'#dddcc9',3);for(let i=0;i<4;i++)line(-9,-7+i*5,9,-7+i*5,'#dddcc9',2);line(-12,-5,-22,9,'#dddcc9',4);line(12,-5,22,9,'#dddcc9',4);}else{line(-5,7,-7,23,'#e3bb9a',5);line(5,7,7,23,'#e3bb9a',5);ctx.fillStyle='#262036';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-22,13);ctx.lineTo(22,13);ctx.fill();circle(0,-27,14,'#c79b66');circle(0,-25,11,'#edc7a7');rect(-14,-40,28,7,'#bc8c53');line(-16,1,26,12,'#b59a62',4);circle(26,12,6,'#d8a1ff');circle(-4,-27,1.5,'#29243b');circle(5,-27,1.5,'#29243b');}ctx.restore();}
function draw(){const dpr=devicePixelRatio,w=canvas.width/dpr,h=canvas.height/dpr,scale=w<h?Math.max(w/1100,h/900):Math.min(w/1100,h/760);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#111822';ctx.fillRect(0,0,w,h);const cameraX=w<h?Math.max(w-1100*scale,Math.min(0,w/2-player.x*scale)):(w-1100*scale)/2;ctx.translate(cameraX,(h-760*scale)/2);ctx.scale(scale,scale);background();for(const p of pickups){circle(p.x,p.y,13,'#f0809250');ctx.fillStyle='#ffa0ae';ctx.font='22px sans-serif';ctx.fillText('♥',p.x-10,p.y+8);}const actors=zombies.map(z=>({...z,type:'zombie'}));actors.push({...player,type:hero?'witch':'skeleton',isPlayer:true});actors.sort((a,b)=>a.y-b.y).forEach(a=>{if(a.isPlayer&&player.inv>0&&Math.floor(t*12)%2)return;person(a.x,a.y,a.type,a.phase);if(a.isPlayer){ctx.strokeStyle=hero?'#d6a0ff88':'#c4ec7888';ctx.beginPath();ctx.ellipse(a.x,a.y+22,25,9,0,0,7);ctx.stroke();}});for(const b of shots){circle(b.x,b.y,10,hero?'#cb8aff30':'#c4ec7830');circle(b.x,b.y,5,hero?'#e0b5ff':'#d5ffa0');}for(const p of sparks){ctx.globalAlpha=p.life/.6;circle(p.x,p.y,3,p.color);}ctx.globalAlpha=1;}
function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(running){if(!paused)update(dt);draw();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
